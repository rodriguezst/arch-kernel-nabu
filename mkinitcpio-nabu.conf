# mkinitcpio configuration for linux-nabu
# Based on the default mkinitcpio configuration with additional firmware files

# MODULES
# The following modules are loaded before any boot hooks are run
MODULES=()

# BINARIES
# This setting includes any additional binaries a given user may wish into the CPIO image
BINARIES=()

# FILES
# This setting is similar to BINARIES above, however, files are added as-is and are not parsed in any way
# Include Adreno GPU firmware for Qualcomm SM8150 (Xiaomi Pad 5 / nabu)
FILES=(
  /lib/firmware/qcom/a630_sqe.fw
  /lib/firmware/qcom/a640_gmu.bin
  /lib/firmware/qcom/sm8150/xiaomi/nabu/a640_zap.mbn
)

# HOOKS
# This is the most important setting in this file
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)

# COMPRESSION
# Use this to compress the initramfs image. By default, gzip compression is used
#COMPRESSION="gzip"
#COMPRESSION="bzip2"
#COMPRESSION="lzma"
#COMPRESSION="xz"
#COMPRESSION="lzop"
#COMPRESSION="lz4"
#COMPRESSION="zstd"

# COMPRESSION_OPTIONS
# Additional options for the compressor
#COMPRESSION_OPTIONS=()
